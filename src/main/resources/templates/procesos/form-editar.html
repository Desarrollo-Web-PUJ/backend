<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Editar proceso</title></head>
<body>
<h1>Editar proceso</h1>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form th:action="@{/procesos/{id}(id=${procesoId})}" th:object="${proceso}" method="post">
    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}" required/><br/>

    <label>Descripción:</label>
    <textarea th:field="*{descripcion}"></textarea><br/>

    <label>Categoría:</label>
    <input type="text" th:field="*{categoria}" required/><br/>

    <label>Estado:</label>
    <select th:field="*{estado}">
        <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
    </select><br/>

    <button type="submit">Guardar cambios</button>
</form>

<a th:href="@{/procesos/{id}(id=${procesoId})}">Cancelar</a>
</body>
</html>
